<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub | Food Ordering</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">

	<div class="login-shell">
		<section class="login-intro">
			<div class="brand large-brand">
				<span class="brand-mark">F</span> <span>FoodHub</span>
			</div>

			<p class="eyebrow light">FOOD ORDERING APPLICATION</p>
			<h1>
				Good food.<br> <span>Good mood.</span>
			</h1>
			<p>Discover local restaurants, build your cart and place your
				favourite meal in a few simple steps.</p>

			<div class="food-strip">
				<span>🍕</span><span>🍛</span><span>🥘</span><span>🍔</span>
			</div>
		</section>

		<section class="login-card">
			<div class="mobile-brand">
				<span class="brand-mark">F</span> <strong>FoodHub</strong>
			</div>

			<p class="eyebrow">WELCOME BACK</p>
			<h2>Sign in</h2>
			<p class="muted">Use your email and password to continue.</p>

			<form id="loginForm">
				<label> Login as <select id="role">
						<option value="CUSTOMER">Customer</option>
						<option value="RESTAURANT">Restaurant</option>
				</select>
				</label> <label> Email <input id="email" type="email"
					placeholder="you@example.com" required>
				</label> <label> Password
					<div class="password-wrap">
						<input id="password" type="password" placeholder="Enter password"
							required>
						<button type="button" id="loginPasswordToggle"
							class="password-toggle" data-password="password"
							aria-label="Show password">◉</button>
					</div>
				</label> <a href="/forgot-password.html" class="forgot-password"> Forgot
					password? </a>

				<button class="btn primary full login-submit" type="submit">
					Sign in</button>
			</form>

			<div id="loginMessage" class="message"></div>

			<div class="register-links">
				<button class="text-btn" data-open="customerRegister">
					Create customer account</button>
				<button class="text-btn" data-open="restaurantRegister">
					Register restaurant</button>
			</div>
		</section>
	</div>

	<div class="modal hidden" id="registerModal">
		<div class="modal-card">
			<button class="modal-close" id="closeRegister">×</button>
			<div id="registerContent"></div>
		</div>
	</div>

	<script src="/js/common.js"></script>
	<script src="/js/login.js"></script>
</body>
</html>
