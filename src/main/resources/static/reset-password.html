<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodHub | Reset Password</title>

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/login.css">
</head>

<body>

	<main class="auth-page">

		<section class="auth-card">

			<a href="/" class="brand"> <span class="brand-mark">F</span> <span>FoodHub</span>
			</a>

			<div class="auth-heading">

				<p class="eyebrow">ACCOUNT RECOVERY</p>

				<h1>Reset password</h1>

				<p class="muted">Enter a new password for your FoodHub account.
				</p>

			</div>

			<form id="resetPasswordForm">

				<label> New Password

					<div class="password-wrap">

						<input id="newPassword" type="password" minlength="4"
							placeholder="Enter new password" required>

						<button type="button" id="newPasswordToggle"
							class="password-toggle">Show</button>

					</div>

				</label> <label> Confirm Password

					<div class="password-wrap">

						<input id="confirmPassword" type="password" minlength="4"
							placeholder="Confirm new password" required>

						<button type="button" id="confirmPasswordToggle"
							class="password-toggle">Show</button>

					</div>

				</label>

				<button type="submit" class="btn primary full">Reset
					Password</button>

			</form>

			<div id="resetMessage" class="message"></div>

			<p class="auth-footer">

				Remember your password? <a href="/"> Back to login </a>

			</p>

		</section>

	</main>

	<script src="/js/common.js"></script>
	<script src="/js/reset-password.js"></script>

</body>

</html>
