<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodHub | Forgot Password</title>

<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/login.css">
</head>

<body>

	<main class="auth-page">

		<section class="auth-card">

			<a href="/" class="brand"> <span class="brand-mark">F</span> <span>FoodHub</span>
			</a>

			<div class="auth-heading">

				<p class="eyebrow">ACCOUNT RECOVERY</p>

				<h1>Forgot password?</h1>

				<p class="muted">Enter your registered email and select your
					account type.</p>

			</div>

			<form id="forgotPasswordForm">

				<label> Email <input id="email" type="email"
					placeholder="Enter your email" required>
				</label> <label> Account Type <select id="role" required>

						<option value="">Select account type</option>

						<option value="CUSTOMER">Customer</option>

						<option value="RESTAURANT">Restaurant</option>

				</select>
				</label>

				<button type="submit" class="btn primary full">Send Reset
					Link</button>

			</form>

			<div id="forgotMessage" class="message"></div>

			<p class="auth-footer">

				Remember your password? <a href="/"> Back to login </a>

			</p>

		</section>

	</main>

	<script src="/js/common.js"></script>
	<script src="/js/forgot-password.js"></script>

</body>

</html>
