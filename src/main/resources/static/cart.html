<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub | Cart</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
<div id="appHeader"></div>

<main class="container">
    <div class="page-title">
        <p class="eyebrow">YOUR CART</p>
        <h1>Ready to order?</h1>
        <p class="muted">Review your items before checkout.</p>
    </div>

    <div class="cart-layout">
        <section>
            <div id="cartItems"></div>
            <div id="cartMessage" class="message"></div>
        </section>

        <aside class="summary-card">
            <p class="eyebrow">ORDER SUMMARY</p>
            <div class="summary-row">
                <span>Items</span>
                <strong id="summaryItems">0</strong>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <strong id="summaryTotal">₹0.00</strong>
            </div>
            <button id="checkoutBtn" class="btn primary full">
                Continue to checkout
            </button>
        </aside>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
